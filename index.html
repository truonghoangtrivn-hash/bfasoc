        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 14px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible { outline: 2px solid var(--vna-gold); outline-offset: 2px; }

        /* Logo dùng chung cho màn hình đăng nhập và thanh đầu trang */
        .logo {
            background: var(--logo) no-repeat center / contain;
            aspect-ratio: 460 / 170;
        }

        /* ---------- MÀN HÌNH ĐĂNG NHẬP ---------- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background:
                linear-gradient(180deg, rgba(0, 59, 99, 0) 55%, rgba(0, 38, 66, 0.55) 100%),
                linear-gradient(155deg, #00608e 0%, #003b63 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 16px;
        }
        .login-box {
            background: var(--card-bg);
            padding: 32px 28px 28px;
            border-radius: 14px;
            border-top: 5px solid var(--vna-gold);
            box-shadow: 0 20px 50px rgba(0, 20, 40, 0.35);
            width: 100%; max-width: 360px; text-align: center;
        }
        .login-box .logo { width: 210px; max-width: 100%; margin: 0 auto 18px; }
        .login-box h2 {
            margin: 0; color: var(--vna-deep);
            font-size: 22px; font-weight: 700; letter-spacing: 0.2px;
        }
        .login-box .beta-tag { margin: 4px 0 20px; }
        .login-error {
            color: var(--danger); font-size: 14px; font-weight: 600;
            margin: 14px 0 0;
        }

        .beta-tag {
            text-align: center; font-size: 12px; color: var(--muted-color);
            font-style: italic; margin-bottom: 8px;
        }

        /* ---------- KHUNG CHỨA TOÀN BỘ PHẦN MỀM ---------- */
        .container {
            width: 100%;

        /* Trạng thái "Cập nhật": script đổi sang màu vàng, giữ đúng tông vàng logo */

        /* ---------- GIỚI HẠN 15 DÒNG + NÚT "ĐẦY ĐỦ" ---------- */
        .clampable:not(.expanded) {
            display: -webkit-box; -webkit-box-orient: vertical;
            -webkit-line-clamp: 15; line-clamp: 15;
            overflow: hidden;
        }
        .btn-expand {
            display: none; background: none; border: none; padding: 2px 0;

            }

<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">

                    <label class="checkbox-label"><input type="checkbox" value="Miễn tháo giày" class="take-care-option"> Miễn tháo giày</label>
                    <label class="checkbox-label"><input type="checkbox" value="Goshow" class="take-care-option"> Goshow</label>
                    <label class="checkbox-label"><input type="checkbox" value="Take care IMMI/ANSC" class="take-care-option"> IMMI/ANSC</label>
                    <label class="checkbox-label"><input type="checkbox" value="Khác" class="take-care-option"> Khác</label>
                </div>

            <button class="btn-main" onclick="saveNote()" id="main-submit-btn">Lưu Briefing</button>

        </div>

        <div class="card" id="list-card">
            <h3>Danh sách công việc</h3>

                <label>Xem briefing theo ngày:</label>
                <input type="date" id="filter-date" onchange="renderNotes()">
            </div>

        <div class="card" id="personal-notes-card">
            <h3>Ghi chú cá nhân</h3>

            <input type="text" id="search-personal-note" class="search-input" placeholder="🔍 Tìm kiếm nhanh ghi chú..." oninput="renderPersonalNotes()">
            <textarea id="personal-note-input" rows="10" placeholder="Nhập ghi chú mới vào đây..."></textarea>

            <div class="pnote-actions">
                <button class="btn-main" onclick="savePersonalNote()" id="pnote-submit-btn">Thêm</button>
                <button class="btn-main btn-secondary" onclick="cancelPersonalNoteEdit()" id="pnote-cancel-btn" style="display: none;">Hủy Sửa</button>

    <script>
        // ==========================================
        // XỬ LÝ ĐĂNG NHẬP VÀ TIMEOUT
        // ==========================================
        let idleTimer;
        const IDLE_TIMEOUT_MS = 15 * 60 * 1000;

        function startIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(logout, IDLE_TIMEOUT_MS);
        }

        function resetIdleTimer() {
            if (sessionStorage.getItem('isAuthenticated') === 'true') startIdleTimer();
        }

        function checkPassword() {
            const pwd = document.getElementById('app-password').value;
            if (pwd === "140482") {
                sessionStorage.setItem('isAuthenticated', 'true');
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = ''; 
                document.getElementById('login-error').style.display = 'none';
                startIdleTimer();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('isAuthenticated');
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('app-password').value = '';
            document.getElementById('login-error').style.display = 'none';
            clearTimeout(idleTimer);
            setTimeout(() => document.getElementById('app-password').focus(), 100);
        }

        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(event => {
            window.addEventListener(event, resetIdleTimer, true);
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isAuthenticated') === 'true') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = '';
                startIdleTimer();
            } else {
                setTimeout(() => document.getElementById('app-password').focus(), 100);
            }
        });

        // ==========================================
        // CẤU HÌNH ĐÁM MÂY FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB-FBkdSl8RITRApb9bLCO-icuEVq3KjAc",
            authDomain: "bfasoc-52e00.firebaseapp.com",
            databaseURL: "https://bfasoc-52e00-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bfasoc-52e00",
            storageBucket: "bfasoc-52e00.firebasestorage.app",
            messagingSenderId: "506938701933",
            appId: "1:506938701933:web:07892aa17f9eceb9f3e764"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('briefingData');
        const personalDbRef = database.ref('personalNotesData');

        let notes = []; 
        let personalNotes = []; 
        let editingId = null;
        let editingPersonalNoteId = null;

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            notes = data ? Object.values(data) : [];
            document.getElementById('network-status').innerText = "🟢 Trực tuyến - Dữ liệu đã đồng bộ";
            renderNotes();
        }, (error) => {
            document.getElementById('network-status').innerText = "🔴 Lỗi kết nối mạng";
            document.getElementById('network-status').style.color = "#dc3545";
        });

        personalDbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            personalNotes = data ? Object.values(data) : [];
            renderPersonalNotes();
        });


        // ==========================================
        // XỬ LÝ GHI CHÚ CÁ NHÂN & TÌM KIẾM KHÔNG DẤU & HIGHLIGHT
        // ==========================================
        function removeVietnameseTones(str) {
            if (!str) return "";
            str = str.toLowerCase();
            str = str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            str = str.replace(/đ/g, 'd');
            return str;
        }

        // Chống chèn mã: chuyển ký tự đặc biệt thành văn bản thuần trước khi đưa vào trang
        function escapeHtml(str) {
            return String(str === undefined || str === null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        // Mã định danh chỉ giữ chữ, số, gạch dưới, gạch ngang (dùng trong onclick)
        function safeId(id) { return String(id === undefined || id === null ? '' : id).replace(/[^\w-]/g, ''); }

        // Hàm tô đậm đoạn văn bản trùng với từ khóa
        function highlightText(text, keyword) {
            if (!keyword || !text) return escapeHtml(text);
            
            const normalizedText = removeVietnameseTones(text);
            const normalizedKeyword = removeVietnameseTones(keyword);
            if (!normalizedKeyword) return escapeHtml(text);

            let result = '';
            let currentIndex = 0;
            let matchIndex = normalizedText.indexOf(normalizedKeyword, currentIndex);

            while (matchIndex !== -1) {
                result += escapeHtml(text.substring(currentIndex, matchIndex));
                // Bọc thẻ span có class highlight-text vào đúng vị trí từ khóa gốc
                result += '<span class="highlight-text">' 
                          + escapeHtml(text.substring(matchIndex, matchIndex + normalizedKeyword.length)) 
                          + '</span>';
                currentIndex = matchIndex + normalizedKeyword.length;
                matchIndex = normalizedText.indexOf(normalizedKeyword, currentIndex);
            }
            result += escapeHtml(text.substring(currentIndex));
            return result;
        }

        function savePersonalNote() {
            const content = document.getElementById('personal-note-input').value.trim();
            if (!content) return;

            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;

            if (editingPersonalNoteId) {
                personalDbRef.child(editingPersonalNoteId).update({ 
                    id: editingPersonalNoteId,
                    content: content,
                    dateStr: dateStr 
                });
            } else {
                const id = Date.now().toString();
                const newNote = { id, content, dateStr };
                personalDbRef.child(id).set(newNote); 
            }
            resetPersonalNoteForm();
        }

        function editPersonalNote(id) {
            const note = personalNotes.find(n => n.id === id);
            if (!note) return;

            editingPersonalNoteId = id;
            document.getElementById('personal-note-input').value = note.content;

            const btnSubmit = document.getElementById('pnote-submit-btn');
            btnSubmit.innerText = "Cập nhật";
            btnSubmit.style.backgroundColor = "#ffc107";
            btnSubmit.style.color = "#000";
            
            document.getElementById('pnote-cancel-btn').style.display = "block";
        }

        function resetPersonalNoteForm() {
            editingPersonalNoteId = null;
            document.getElementById('personal-note-input').value = '';
            
            const btnSubmit = document.getElementById('pnote-submit-btn');
            btnSubmit.innerText = "Thêm";
            btnSubmit.style.backgroundColor = "#17a2b8";
            btnSubmit.style.color = "white";
            
            document.getElementById('pnote-cancel-btn').style.display = "none";
        }

        function cancelPersonalNoteEdit() { resetPersonalNoteForm(); }

        function deletePersonalNote(id) {
            if(confirm("Bạn có chắc chắn muốn xoá ghi chú cá nhân này?")) {
                personalDbRef.child(id).remove();
            }
        }

        function renderPersonalNotes() {
            const listDiv = document.getElementById('personal-notes-list');
            const keyword = document.getElementById('search-personal-note').value.trim();
            const searchKey = removeVietnameseTones(keyword);
            listDiv.innerHTML = '';

            let filteredNotes = personalNotes.filter(n => {

        };

        function getShiftDate(dateStr, timeStr) {
            if (timeStr <= "02:00") {
                const parts = dateStr.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                d.setDate(d.getDate() - 1);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }
            return dateStr;
        }

        function getShiftMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            let mins = h * 60 + m;
            if (timeStr <= "02:00") mins += 24 * 60;
            return mins;
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const sec = String(now.getSeconds()).padStart(2, '0');
            const timeString = `${h}:${min}:${sec}`;
            
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const dateString = `${d}/${m}/${y}`;
            
            document.getElementById('clock').innerText = `${timeString} - ${dateString}`;
            checkHighlights();
        }
        setInterval(updateClock, 1000);

        const today = new Date().toLocaleDateString('en-CA');
        document.getElementById('flight-date').value = today;
        document.getElementById('filter-date').value = today;

        document.getElementById('flight-number').addEventListener('input', function(e) {
            let val = e.target.value.toUpperCase().trim();
            if (/^\d+$/.test(val)) val = 'VN' + val;
            if (flightData[val]) {
                const [h, m] = flightData[val].split(':');
                document.getElementById('flight-time-hour').value = h;
                document.getElementById('flight-time-minute').value = m;
            }
        });

        function resetForm() {
            editingId = null;
            document.getElementById('flight-number').value = '';
            document.getElementById('flight-time-hour').value = '00';
            document.getElementById('flight-time-minute').value = '00';
            document.getElementById('note-content').value = '';
            document.querySelectorAll('.take-care-option').forEach(cb => cb.checked = false);
            
            const currentToday = new Date().toLocaleDateString('en-CA');
            document.getElementById('flight-date').value = currentToday;
            
            const btnMain = document.getElementById('main-submit-btn');
            btnMain.innerText = "Lưu Briefing";
            btnMain.style.backgroundColor = "var(--primary-color)";
            btnMain.style.color = "white";
            
            document.getElementById('cancel-edit-btn').style.display = "none";
        }

        function cancelEdit() { resetForm(); }

        function editBriefing(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;

            editingId = id;
            document.getElementById('flight-number').value = note.flightNo;
            const [h, m] = note.time.split(':');
            document.getElementById('flight-time-hour').value = h;
            document.getElementById('flight-time-minute').value = m;
            document.getElementById('flight-date').value = note.date;
            document.getElementById('note-content').value = note.content;

            const checkboxes = document.querySelectorAll('.take-care-option');
            checkboxes.forEach(cb => cb.checked = false);
            if (note.options) {
                checkboxes.forEach(cb => {
                    if (note.options.includes(cb.value)) cb.checked = true;
                });
            }

            const btnMain = document.getElementById('main-submit-btn');
            btnMain.innerText = "Cập nhật Briefing";
            btnMain.style.backgroundColor = "#ffc107";
            btnMain.style.color = "#000";
            document.getElementById('cancel-edit-btn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveNote() {
            let flightNo = document.getElementById('flight-number').value.toUpperCase().trim();
            if (/^\d+$/.test(flightNo)) flightNo = 'VN' + flightNo;
            
            const h = document.getElementById('flight-time-hour').value;
            const m = document.getElementById('flight-time-minute').value;
            const time = `${h}:${m}`;
            const date = document.getElementById('flight-date').value;
            const content = document.getElementById('note-content').value.trim();
            
            const checkboxes = document.querySelectorAll('.take-care-option:checked');
            const options = Array.from(checkboxes).map(cb => cb.value);

            if (!flightNo || !date || !content) { 
                alert("Vui lòng nhập đầy đủ SHCB, Ngày bay và Nội dung briefing!"); 
                return; 
            }
            if (options.length === 0) {
                alert("Vui lòng chọn ít nhất một 'Nội dung cần take care'!");
                return;
            }

            const now = new Date();
            const etdDateTime = new Date(`${date}T${time}:00`);
            
            if (!editingId && etdDateTime < now) {
                alert("ETD đã qua! Không thể tạo briefing cho chuyến bay trong quá khứ.");
                return;
            }

            let autoContent = `✈️ Briefing: ${flightNo} (ETD: ${time})\n📝 ${content}`;
            if (options.length > 0) {
                autoContent += `\n📌 Take care: ${options.join(' | ')}`;
            }

            const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;

            if (editingId) {
                dbRef.child(editingId).update({ flightNo, time, date, content, options });

                const pNoteId = "auto_" + editingId;
                personalDbRef.child(pNoteId).update({ 
                    id: pNoteId, 
                    content: autoContent,
                    dateStr: dateStr
                });

            } else {
                const id = Date.now().toString();
                const newNote = { id, flightNo, time, date, content, options, subNote: "", isDone: false };
                dbRef.child(id).set(newNote);

                const pNoteId = "auto_" + id; 
                personalDbRef.child(pNoteId).set({
                    id: pNoteId,
                    content: autoContent,
                    dateStr: dateStr
                });
            }
            
            resetForm();
            const currentToday = new Date().toLocaleDateString('en-CA');
            document.getElementById('filter-date').value = currentToday;
            renderNotes();
        }

        function renderNotes() {
            const listDiv = document.getElementById('notes-list');
            const filterDate = document.getElementById('filter-date').value;
            listDiv.innerHTML = '';

            let filteredNotes = notes.filter(n => {
                const shiftDate = getShiftDate(n.date, n.time);
                return shiftDate === filterDate;
            });
            
            filteredNotes.sort((a, b) => getShiftMinutes(a.time) - getShiftMinutes(b.time));

            const activeNotes = filteredNotes.filter(n => !n.isDone);
            const doneNotes = filteredNotes.filter(n => n.isDone);
            const sortedNotes = [...activeNotes, ...doneNotes];

            if (sortedNotes.length === 0) {
                listDiv.innerHTML = '<p style="text-align: center; color: #888;">Không có briefing nào cho ca trực ngày này.</p>';
                return;
            }

            sortedNotes.forEach(note => {
                const noteEl = document.createElement('div');
                noteEl.className = `note-item ${note.isDone ? 'done' : ''}`;
                noteEl.id = `note-${note.id}`;
                noteEl.dataset.time = note.time;
                noteEl.dataset.options = JSON.stringify(note.options || []);

                const opts = note.options || [];

                noteEl.innerHTML = `
                    <div class="note-header">
                        <span><span class="warning-icon">🚨</span>✈️ ${escapeHtml(note.flightNo)} (ETD: ${escapeHtml(note.time)})</span>
                    </div>
                    ${opts.length > 0 ? `<div class="note-options">[ ${escapeHtml(opts.join(' | '))} ]</div>` : ''}
                    ${note.content ? `<div class="note-content">${escapeHtml(note.content)}</div>` : ''}
                    ${note.subNote ? `<div class="sub-note">📌 ${escapeHtml(note.subNote)}</div>` : ''}
                    <div class="note-actions">
                        ${note.isDone 
                            ? `<button class="btn-small btn-restore" onclick="toggleStatus('${safeId(note.id)}')">Khôi phục</button>` 
                            : `<button class="btn-small btn-done" onclick="toggleStatus('${safeId(note.id)}')">Xong</button>`
                        }
                        <button class="btn-small btn-edit" onclick="editBriefing('${safeId(note.id)}')">Sửa</button>
                        <button class="btn-small btn-note-edit" onclick="editBriefingNote('${safeId(note.id)}')">Note</button>
                        <button class="btn-small btn-delete" onclick="deleteNote('${safeId(note.id)}')">Xoá</button>
                    </div>
                `;
                listDiv.appendChild(noteEl);
            });
            checkHighlights();
        }

        function toggleStatus(id) {
            const note = notes.find(n => n.id === id);
            if (note) dbRef.child(id).update({ isDone: !note.isDone });
        }

        function deleteNote(id) {
            if(confirm("Bạn có chắc chắn muốn xoá briefing này?")) {
                dbRef.child(id).remove();
                personalDbRef.child("auto_" + id).remove();
            }
        }

        function editBriefingNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                const newSubNote = prompt("Nhập nội dung ghi chú phụ:", note.subNote || "");
                if (newSubNote !== null) dbRef.child(id).update({ subNote: newSubNote.trim() });
            }
        }

        function checkHighlights() {
            const filterDate = document.getElementById('filter-date').value;
            const now = new Date();
            
            const currentH = String(now.getHours()).padStart(2, '0');
            const currentM = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentH}:${currentM}`;
            const currentShiftMins = getShiftMinutes(currentTimeStr);

            let currentShiftDateObj = new Date(now);
            if (currentTimeStr <= "02:00") currentShiftDateObj.setDate(currentShiftDateObj.getDate() - 1);
            const y = currentShiftDateObj.getFullYear();
            const m = String(currentShiftDateObj.getMonth() + 1).padStart(2, '0');
            const d = String(currentShiftDateObj.getDate()).padStart(2, '0');
            const currentShiftDateStr = `${y}-${m}-${d}`;

            if (filterDate !== currentShiftDateStr) return;

            const activeItems = document.querySelectorAll('.note-item:not(.done)');
            activeItems.forEach(item => {
                const etd = item.dataset.time;
                const options = JSON.parse(item.dataset.options || '[]');
                
                const etdShiftMins = getShiftMinutes(etd);
                const diff = etdShiftMins - currentShiftMins;

                let highlightThreshold = 0;
                if (options.includes("UPW") || options.includes("Miễn tháo giày")) {
                    highlightThreshold = 120;
                } else if (options.includes("Goshow") || options.includes("UPJ")) {
                    highlightThreshold = 60;
                } else {
                    // Chưa cài thời gian cảnh báo riêng: dùng mức chung 90 phút trước ETD
                    highlightThreshold = 90;
                }

                if (highlightThreshold > 0 && diff <= highlightThreshold && diff >= -120) {
                    item.classList.add('highlight');
                } else {
                    item.classList.remove('highlight');
                }
            });
        }
    </script>
    <script>
        // ===== Giới hạn hiển thị 15 dòng + nút "Đầy đủ" cho Danh sách công việc và Ghi chú cá nhân =====
        (function () {
            const expanded = new Set(); // nhớ ghi chú nào đang mở rộng, vì danh sách được dựng lại mỗi lần dữ liệu đổi

            function keyOf(el) {
                const note = el.closest('.note-item');
                if (note) return 'b:' + note.id;
                const pnote = el.closest('.personal-note-item');
                return pnote ? 'p:' + (pnote.dataset.noteKey || '') : '';
            }

            function update(el) {
                const btn = el.nextElementSibling;
                if (!btn || !btn.classList.contains('btn-expand')) return;
                const isExpanded = el.classList.contains('expanded');
                const overflow = !isExpanded && el.scrollHeight > el.clientHeight + 1;
                btn.classList.toggle('show', isExpanded || overflow);
                btn.textContent = isExpanded ? 'Thu gọn' : 'Đầy đủ';
            }

            // Tự cập nhật khi đổi kích thước cửa sổ hoặc khi phần mềm vừa được hiện ra sau đăng nhập
            const sizeObserver = new ResizeObserver(entries => entries.forEach(e => update(e.target)));

            function enhance(el) {
                if (el.dataset.clampReady) return;
                el.dataset.clampReady = '1';
                el.classList.add('clampable');
                const key = keyOf(el);
                if (key && expanded.has(key)) el.classList.add('expanded');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn-expand';
                el.insertAdjacentElement('afterend', btn);
                sizeObserver.observe(el);
                update(el);
            }

            function scan(list) {
                list.querySelectorAll('.note-content, .p-note-content').forEach(enhance);
            }

            ['notes-list', 'personal-notes-list'].forEach(id => {
                const list = document.getElementById(id);
                scan(list);
                new MutationObserver(() => scan(list)).observe(list, { childList: true, subtree: true });
            });

            document.addEventListener('click', e => {
                const btn = e.target.closest('.btn-expand');
                if (!btn) return;
                const el = btn.previousElementSibling;
                if (!el) return;
                const key = keyOf(el);
                const nowExpanded = el.classList.toggle('expanded');
                if (key) { if (nowExpanded) expanded.add(key); else expanded.delete(key); }
                update(el);
            });
        })();
    </script>
